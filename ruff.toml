target-version = "py310"
line-length = 88
# Enforce extend-exclude even for directly-passed files and stdin, so the
# pre-commit hook skips baselinedir/models.
force-exclude = true
extend-exclude = ["baselinedir", ".claude", "models"]

[lint]
select = [
    "E4",  # pycodestyle errors
    "E7",  # pycodestyle (statement-level)
    "E9",  # pycodestyle (runtime/syntax errors)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, f-string issues)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax/annotations)
]
ignore = [
    "E402",  # module import not at top: sys.path setup pattern in scripts
    "E701",  # compact single-line if/else is established style here
    "E702",
    "E731",  # lambda assignment in bench/tuning code
]

[lint.isort]
known-first-party = ["sm110a_kernel", "common"]

[lint.per-file-ignores]
# Package roots re-export the public API via a dynamically built __all__.
"**/__init__.py" = ["F401"]
